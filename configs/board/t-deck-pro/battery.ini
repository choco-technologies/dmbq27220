; LILYGO T-Deck Pro: the battery gauge (BQ27220, at 0x55 on the I2C bus of the board; SDA = GPIO13, SCL = GPIO14) - one cell of 3000 mAh.
;
; The bus is the one of the touch panel (touch.ini of dmcst66xx, the section touch_i2c: the controller 1 of dmi2c), so there is no bus here:
; the gauge joins the friends_group of the e-paper (epd) and takes the node of the bus with the role "i2c" from it, as the keyboard does. dmi2c
; and dmcst66xx's touch.ini must be loaded (the gauge is created after them: driver_order).
;
; The node (/dev/battery) is the battery interface of dmdrvi: cat /dev/battery gives the state for a shell.
; The chip is set up (the capacity of the battery, the profile) by the vendor's firmware and is only read here.
; The BQ27220 holds SCL low while it answers (clock stretching): dmi2c waits for it up to timeout_ms of the bus.
;
; refresh_ms: the chip is asked at most this often; a client that asks more often gets the last reading.
; low_percent / critical_percent: the flags LOW and CRITICAL of a battery that is discharged (the chip's own alarms set them too).

[battery]
driver_name=dmbq27220
driver_order=4
friends_group=epd
instance=0
address=85
refresh_ms=1000
low_percent=15
critical_percent=5
